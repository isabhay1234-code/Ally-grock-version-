  build:
    needs: unpack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout latest (includes files added by the unpack job)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Check project layout
        run: |
          for f in settings.gradle.kts build.gradle.kts app/build.gradle.kts gradle/libs.versions.toml; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing $f. If the unpack job failed, open it and read the error."
              exit 1
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's ubuntu runners already include the Android SDK (ANDROID_HOME).
      # We skip the android-actions/setup-android action, which tries to install
      # the obsolete "tools" package and fails. We only add what ALLAY needs.
      - name: Prepare Android SDK (platform 35 + build-tools 34.0.0)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"; fi
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify the APK (exists, not empty, package name)
        run: |
          set -e
          COUNT=$(ls app/build/outputs/apk/debug/*.apk | wc -l)
          if [ "$COUNT" != "1" ]; then echo "::error::Expected exactly one APK, found $COUNT"; exit 1; fi
          APK=$(ls app/build/outputs/apk/debug/*.apk)
          if [ ! -s "$APK" ]; then echo "::error::APK is empty"; exit 1; fi
          ls -l "$APK"
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/34.0.0/aapt2)
          "$AAPT2" dump badging "$APK" | grep -m1 "^package:" | tee badging.txt
          grep -q "name='com.allay.app'" badging.txt || { echo "::error::Unexpected package name"; exit 1; }

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allay-test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: allay-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
